<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>TopHost — Tocá el timbre. Demostrá que sabés.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B2521;
    --bg: #FFFFFF;
    --c-reservas: #E8784A;
    --c-aircover: #6BCB6B;
    --c-contenido: #F5DE50;
    --c-comunicacion: #4CC3E8;
    --c-precios: #9B63C2;
    --c-actualizaciones: #E6A0E3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Hanken Grotesk', sans-serif;
    max-width: 420px; margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  .serif { font-family: 'DM Serif Display', serif; }
  .mono { font-family: 'Space Mono', monospace; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 4px; }
  header .brand { display: flex; align-items: center; gap: 8px; }
  header .logout { background: none; border: none; font: 600 11px 'Hanken Grotesk'; color: rgba(43,37,33,.45); cursor: pointer; text-decoration: underline; }

  #hud { display: flex; justify-content: space-between; align-items: center; padding: 4px 20px 8px; font-size: 13px; }
  #hud .rating { display: flex; align-items: center; gap: 5px; font: 700 14px 'Space Mono'; }
  #hud .lives { display: flex; gap: 3px; }
  #hud .streak { background: var(--c-reservas); color: #fff; padding: 3px 8px; border-radius: 8px; font-weight: 700; font-size: 11px; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px 24px 24px; gap: 14px; text-align: center;
  }

  .ding-svg { display: block; margin: 0 auto; }
  .hint { font-size: 12px; color: rgba(43,37,33,.55); max-width: 280px; }

  /* Login */
  .auth-box { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .auth-input {
    width: 100%; padding: 13px 14px; border-radius: 12px;
    border: 2px solid rgba(43,37,33,.15); font: 500 14px 'Hanken Grotesk';
  }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font: 700 14px 'Hanken Grotesk'; cursor: pointer; }
  .btn-dark { background: var(--ink); color: #F2C14E; }
  .btn-google { background: #fff; border: 2px solid rgba(43,37,33,.15); color: var(--ink); display:flex; align-items:center; justify-content:center; gap:8px; }
  .auth-toggle { font: 600 12px 'Hanken Grotesk'; color: var(--c-comunicacion); background: none; border: none; cursor: pointer; text-decoration: underline; }
  .auth-error { font: 600 12px 'Hanken Grotesk'; color: var(--c-reservas); }

  #wheel-wrap { position: relative; width: 230px; height: 230px; margin: 6px auto; }
  #pointer { position: absolute; top: -4px; left: 50%; transform: translateX(-50%); z-index: 6; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 20px solid var(--ink); }
  #wheel { width: 230px; height: 230px; border-radius: 50%; box-shadow: 0 12px 30px -8px rgba(43,37,33,.35), inset 0 0 0 6px #fff; transition: transform 3.2s cubic-bezier(.15,.9,.25,1); }
  #spin-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 78px; height: 78px; border-radius: 50%; border: none; background: var(--ink); color: #F2C14E; font-family: 'DM Serif Display', serif; font-size: 16px; cursor: pointer; box-shadow: 0 6px 16px rgba(43,37,33,.4), inset 0 0 0 3px #F2C14E; }
  #spin-btn:disabled { opacity: 0.7; }

  .category-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 8px; font: 700 10px 'Space Mono', monospace; letter-spacing: 1px; text-transform: uppercase; color: #fff; }
  .category-tag .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; }

  #question-text { font-family: 'DM Serif Display', serif; font-size: 19px; line-height: 1.25; text-align: left; width: 100%; }
  #options-list { width: 100%; display: flex; flex-direction: column; gap: 9px; text-align: left; }
  .option { display: flex; align-items: center; gap: 11px; padding: 13px 14px; border-radius: 14px; border: 2px solid rgba(43,37,33,.12); background: #fff; cursor: pointer; font: 600 13px 'Hanken Grotesk'; width: 100%; transition: .15s; }
  .option:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-1px); }
  .option .letter { width: 26px; height: 26px; flex: none; border-radius: 8px; background: #F4F4F4; display: flex; align-items: center; justify-content: center; font: 700 12px 'Space Mono'; }
  .option.correct { border-color: var(--c-aircover); background: #EAF8EA; }
  .option.incorrect { border-color: var(--c-reservas); background: #FCEEE7; }

  .result-tag { font: 700 12px 'Space Mono'; letter-spacing: 2px; }
  .result-title { font-family: 'DM Serif Display', serif; font-size: 26px; margin-top: 2px; }
  .streak-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; background: var(--c-reservas); color: #fff; padding: 5px 12px; border-radius: 20px; font: 700 12px 'Space Mono'; }

  .explanation { margin-top: 18px; text-align: left; background: #fff; border: 1.5px solid rgba(43,37,33,.15); border-radius: 16px; padding: 16px; width: 100%; }
  .explanation .label { font: 700 10px 'Space Mono'; letter-spacing: 1px; margin-bottom: 6px; }
  .explanation p { font: 500 13px/1.5 'Hanken Grotesk'; }

  .primary-btn { margin-top: 20px; width: 100%; padding: 15px; border: none; border-radius: 14px; font-family: 'DM Serif Display', serif; font-size: 17px; cursor: pointer; box-shadow: 0 6px 14px -4px rgba(43,37,33,.35); }
  .primary-btn.dark { background: var(--ink); color: #F2C14E; }
  .primary-btn.correct { background: var(--c-aircover); color: #12420F; }
  .primary-btn:disabled { opacity: .5; cursor: default; }

  .stars-row { display: flex; gap: 4px; justify-content: center; margin: 8px 0; }
  .rating-delta { font: 700 13px 'Space Mono'; }
  .rating-delta.up { color: #3F9A40; }
  .rating-delta.down { color: var(--c-reservas); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="ding-svg" width="26" height="28" viewBox="0 0 160 170" id="mini-bell-header"></svg>
    <span class="serif" style="font-size:20px;">TopHost</span>
  </div>
  <button class="logout" id="logout-btn" style="display:none;">Salir</button>
</header>

<div id="hud" style="display:none;">
  <div class="rating"><span id="star-icon"></span><span id="rating-display">5.00</span></div>
  <div class="lives" id="lives-display"></div>
  <div class="streak" id="streak-display" style="display:none;"></div>
</div>

<main id="main"></main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <radialGradient id="thDome" cx="38%" cy="26%" r="82%"><stop offset="0%" stop-color="#FDF1C6"/><stop offset="40%" stop-color="#F3C64F"/><stop offset="80%" stop-color="#D89B2E"/><stop offset="100%" stop-color="#B67C21"/></radialGradient>
  <linearGradient id="thRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C8892B"/><stop offset="100%" stop-color="#96661C"/></linearGradient>
  <radialGradient id="thSpec" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff" stop-opacity="0.9"/><stop offset="55%" stop-color="#fff" stop-opacity="0.18"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="thKnob" cx="34%" cy="28%" r="82%"><stop offset="0%" stop-color="#FDF1C6"/><stop offset="58%" stop-color="#EBB63F"/><stop offset="100%" stop-color="#C0821F"/></radialGradient>
  <linearGradient id="thBase" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A4038"/><stop offset="100%" stop-color="#221D18"/></linearGradient>
  <radialGradient id="thBaseTop" cx="50%" cy="28%" r="72%"><stop offset="0%" stop-color="#6E6155"/><stop offset="100%" stop-color="#38302A"/></radialGradient>
  <radialGradient id="thShadow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2B2521" stop-opacity="0.24"/><stop offset="68%" stop-color="#2B2521" stop-opacity="0.1"/><stop offset="100%" stop-color="#2B2521" stop-opacity="0"/></radialGradient>
  <symbol id="thBell" viewBox="0 0 160 170">
    <ellipse cx="80" cy="150" rx="54" ry="11" fill="url(#thShadow)"/>
    <rect x="30" y="126" width="100" height="18" rx="9" fill="url(#thBase)"/>
    <ellipse cx="80" cy="126" rx="50" ry="10" fill="url(#thBaseTop)"/>
    <path d="M36 126 C36 62 60 56 80 56 C100 56 124 62 124 126 Z" fill="url(#thDome)"/>
    <ellipse cx="80" cy="124" rx="44" ry="8" fill="url(#thRim)"/>
    <ellipse cx="61" cy="88" rx="15" ry="24" fill="url(#thSpec)" transform="rotate(-16 61 88)"/>
    <path d="M112 74 C121 92 121 110 114 122" stroke="#FDF1C6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
    <rect x="75" y="42" width="10" height="18" rx="5" fill="url(#thRim)"/>
    <circle cx="80" cy="38" r="11" fill="url(#thKnob)"/>
    <ellipse cx="76.5" cy="34.5" rx="3.4" ry="2.4" fill="#fff" opacity="0.7"/>
  </symbol>
</defs>
</svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://entmaqfrglzlypaeatsz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_1UcRP6Q15AO81GEmPg4TOw_HVGTGcDS";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const LIFE_REGEN_MINUTES = 1; // cada cuánto se regenera 1 corazón (etapa de pruebas)
  const MAX_LIVES = 3;
  const STARS_CORRECT = 5;
  const STARS_INCORRECT = 1;

  const CATEGORIES = [
    { id: 'reservas', name: 'Reservas y Cancelaciones', hex: '#E8784A' },
    { id: 'aircover', name: 'AirCover y Seguridad', hex: '#6BCB6B' },
    { id: 'contenido', name: 'Contenido y Publicación', hex: '#F5DE50' },
    { id: 'comunicacion', name: 'Comunicación', hex: '#4CC3E8' },
    { id: 'precios', name: 'Precios y Visibilidad', hex: '#9B63C2' },
    { id: 'actualizaciones', name: 'Actualizaciones', hex: '#E6A0E3' }
  ];

  const FALLBACK_QUESTIONS = {
    reservas: [{ question: '¿Cuál es la política de cancelación más flexible?', options: ['Flexible: reembolso hasta 24hs antes', 'Estricta: sin reembolso', 'Moderada: 30 días antes', 'No existen'], correct_index: 0, explanation: 'La política Flexible permite cancelar gratis hasta 24hs antes del check-in.' }],
    aircover: [{ question: 'Un huésped daña un mueble. ¿En qué plazo debés reportarlo para AirCover?', options: ['Antes del próximo huésped', 'Dentro de los 14 días', 'Hasta 30 días después', 'No hay límite'], correct_index: 1, explanation: 'Tenés hasta 14 días post-checkout, o antes del próximo check-in, lo que ocurra primero.' }],
    contenido: [{ question: '¿Qué debe reflejar la foto de portada de tu listing?', options: ['Una imagen genérica', 'El espacio real', 'Una foto tuya', 'Tu logo'], correct_index: 1, explanation: 'La foto de portada debe mostrar honestamente el espacio real.' }],
    comunicacion: [{ question: '¿Qué mejora tu ranking relacionado a mensajería?', options: ['Responder rápido', 'Ignorar mensajes', 'Responder tarde', 'No afecta'], correct_index: 0, explanation: 'Airbnb favorece a quienes responden rápido.' }],
    precios: [{ question: '¿Qué es el Smart Pricing?', options: ['Descuento fijo', 'Ajuste automático según demanda', 'Recargo obligatorio', 'Precio fijo'], correct_index: 1, explanation: 'Ajusta tarifas automáticamente según demanda y temporada.' }],
    actualizaciones: [{ question: '¿Cada cuánto conviene revisar cambios de políticas?', options: ['Nunca', 'Periódicamente', 'Solo al crear la cuenta', 'Cada 5 años'], correct_index: 1, explanation: 'Las políticas cambian con frecuencia; conviene revisarlas seguido.' }]
  };

  function dingSVG(mood, size) {
    const base = `<use href="#thBell"/>`;
    const eyesClosed = `<ellipse cx="66" cy="97" rx="7" ry="8.5" fill="#2B2521"/><ellipse cx="94" cy="97" rx="7" ry="8.5" fill="#2B2521"/><circle cx="68.6" cy="93.4" r="2.3" fill="#fff"/><circle cx="96.6" cy="93.4" r="2.3" fill="#fff"/><path d="M72 109 Q80 117 88 109" stroke="#2B2521" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    let inner = base;
    if (mood === 'bienvenida') inner += eyesClosed;
    if (mood === 'correcto') inner = `<path d="M24 40 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#F5DE50"/><path d="M134 52 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" fill="#4CC3E8"/>${base}<path d="M59 99 Q66 90 73 99" stroke="#2B2521" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M87 99 Q94 90 101 99" stroke="#2B2521" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="54" cy="108" rx="6" ry="4" fill="#F19B8E" opacity="0.55"/><ellipse cx="106" cy="108" rx="6" ry="4" fill="#F19B8E" opacity="0.55"/><path d="M68 107 Q80 122 92 107 Q80 115 68 107 Z" fill="#2B2521"/>`;
    if (mood === 'incorrecto') inner = `${base}<path d="M57 88 Q64 84 71 88" stroke="#2B2521" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M89 88 Q96 84 103 88" stroke="#2B2521" stroke-width="2.6" fill="none" stroke-linecap="round"/><ellipse cx="66" cy="98" rx="6" ry="7" fill="#2B2521"/><ellipse cx="94" cy="98" rx="6" ry="7" fill="#2B2521"/><circle cx="68" cy="95" r="2" fill="#fff"/><circle cx="96" cy="95" r="2" fill="#fff"/><path d="M72 113 Q80 107 88 113" stroke="#2B2521" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
    if (mood === 'gameover') inner = `${base}<path d="M36 126 C36 62 60 56 80 56 C100 56 124 62 124 126 Z" fill="#8B8178" opacity="0.32"/><path d="M60 92 l11 11 M71 92 l-11 11" stroke="#2B2521" stroke-width="3" stroke-linecap="round"/><path d="M89 92 l11 11 M100 92 l-11 11" stroke="#2B2521" stroke-width="3" stroke-linecap="round"/><path d="M72 114 Q80 109 88 114" stroke="#2B2521" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
    return `<svg class="ding-svg" width="${size}" height="${size*1.06}" viewBox="0 0 160 170">${inner}</svg>`;
  }
  document.getElementById('mini-bell-header').outerHTML = dingSVG('bienvenida', 26);

  function starSVG(filled, size) {
    size = size || 16;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="M12 2 L14.9 8.6 L22 9.3 L16.7 14.1 L18.2 21.2 L12 17.6 L5.8 21.2 L7.3 14.1 L2 9.3 L9.1 8.6 Z" fill="${filled ? '#2B2521' : 'rgba(43,37,33,.15)'}"/></svg>`;
  }
  document.getElementById('star-icon').innerHTML = starSVG(true, 15);

  function heartSVG(filled) {
    return `<svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 4 Q12 2 14 2 Q17 2 17 5 Q17 8 12 11 Q7 8 7 5 Q7 2 10 2 Q12 2 12 4Z" fill="${filled ? '#E8784A' : 'rgba(43,37,33,.14)'}"/></svg>`;
  }

  // ====== ESTADO ======
  let session = null;      // sesión de Supabase Auth
  let player = null;       // fila de la tabla players
  let lives = 3, streak = 0;
  let sessionCorrect = 0, sessionTotal = 0; // para calcular la "reseña" de esta partida
  let currentCategory = null, currentQuestion = null;
  let questionsCache = {};
  let regenInterval = null;

  const main = document.getElementById('main');
  const hud = document.getElementById('hud');
  const logoutBtn = document.getElementById('logout-btn');
  const livesDisplay = document.getElementById('lives-display');
  const ratingDisplay = document.getElementById('rating-display');
  const streakDisplay = document.getElementById('streak-display');

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.reload();
  });

  function updateHud() {
    livesDisplay.innerHTML = Array.from({length: MAX_LIVES}, (_, i) => heartSVG(i < lives)).join('');
    ratingDisplay.textContent = player.total_reviews > 0 ? Number(player.rating).toFixed(2) : '—';
    if (streak > 0) {
      streakDisplay.style.display = 'inline-flex';
      streakDisplay.textContent = '🔥 x' + streak;
    } else {
      streakDisplay.style.display = 'none';
    }
  }

  // ====== AUTH ======
  async function init() {
    const { data: { session: s } } = await supabaseClient.auth.getSession();
    session = s;
    if (session) {
      await loadOrCreatePlayer();
      hud.style.display = 'flex';
      logoutBtn.style.display = 'inline';
      startLivesRegenLoop();
      renderHome();
    } else {
      renderLogin();
    }
  }

  supabaseClient.auth.onAuthStateChange((event, s) => {
    if (event === 'SIGNED_IN' && !session) {
      session = s;
      loadOrCreatePlayer().then(() => {
        hud.style.display = 'flex';
        logoutBtn.style.display = 'inline';
        startLivesRegenLoop();
        renderHome();
      });
    }
  });

  async function loadOrCreatePlayer() {
    const uid = session.user.id;
    let { data, error } = await supabaseClient.from('players').select('*').eq('id', uid).maybeSingle();
    if (!data) {
      const { data: created } = await supabaseClient.from('players').insert({
        id: uid, email: session.user.email, rating: 0, total_reviews: 0,
        lives: MAX_LIVES, next_life_at: null
      }).select().single();
      data = created;
    }
    player = data;
    lives = applyLifeRegen();
  }

  function applyLifeRegen() {
    let l = player.lives;
    if (l >= MAX_LIVES || !player.next_life_at) return l;
    const now = Date.now();
    const next = new Date(player.next_life_at).getTime();
    if (now >= next) {
      const elapsedMin = (now - next) / 60000;
      const regained = 1 + Math.floor(elapsedMin / LIFE_REGEN_MINUTES);
      l = Math.min(MAX_LIVES, l + regained);
      player.next_life_at = l >= MAX_LIVES ? null : new Date(now + LIFE_REGEN_MINUTES*60000).toISOString();
      savePlayerLives(l, player.next_life_at);
    }
    return l;
  }

  async function savePlayerLives(l, nextAt) {
    player.lives = l;
    player.next_life_at = nextAt;
    await supabaseClient.from('players').update({ lives: l, next_life_at: nextAt }).eq('id', player.id);
  }

  function startLivesRegenLoop() {
    if (regenInterval) clearInterval(regenInterval);
    regenInterval = setInterval(() => {
      const newLives = applyLifeRegen();
      if (newLives !== lives) {
        lives = newLives;
        updateHud();
      }
    }, 15000);
  }

  function renderLogin() {
    main.innerHTML = `
      ${dingSVG('bienvenida', 84)}
      <div class="serif" style="font-size:24px;">Tocá el timbre</div>
      <p class="hint">Iniciá sesión para guardar tu rating de anfitrión.</p>
      <div class="auth-box">
        <input class="auth-input" id="email-input" type="email" placeholder="Email" />
        <input class="auth-input" id="password-input" type="password" placeholder="Contraseña" />
        <div class="auth-error" id="auth-error"></div>
        <button class="btn btn-dark" id="submit-btn">Ingresar</button>
        <button class="auth-toggle" id="toggle-mode">¿No tenés cuenta? Registrate</button>
        <div style="display:flex; align-items:center; gap:10px; margin:6px 0;">
          <div style="flex:1;height:1px;background:rgba(43,37,33,.15);"></div>
          <span style="font-size:11px;color:rgba(43,37,33,.4);">o</span>
          <div style="flex:1;height:1px;background:rgba(43,37,33,.15);"></div>
        </div>
        <button class="btn btn-google" id="google-btn">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.7 35.4 27 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.5l6.6 5.4C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Continuar con Google
        </button>
      </div>
    `;

    let mode = 'login';
    const toggleBtn = document.getElementById('toggle-mode');
    const submitBtn = document.getElementById('submit-btn');
    const errorDiv = document.getElementById('auth-error');

    toggleBtn.addEventListener('click', () => {
      mode = mode === 'login' ? 'signup' : 'login';
      submitBtn.textContent = mode === 'login' ? 'Ingresar' : 'Crear cuenta';
      toggleBtn.textContent = mode === 'login' ? '¿No tenés cuenta? Registrate' : '¿Ya tenés cuenta? Ingresá';
      errorDiv.textContent = '';
    });

    submitBtn.addEventListener('click', async () => {
      errorDiv.textContent = '';
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      if (!email || !password) { errorDiv.textContent = 'Completá email y contraseña.'; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = '...';
      let result;
      if (mode === 'login') {
        result = await supabaseClient.auth.signInWithPassword({ email, password });
      } else {
        result = await supabaseClient.auth.signUp({ email, password });
      }
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'login' ? 'Ingresar' : 'Crear cuenta';
      if (result.error) {
        errorDiv.textContent = result.error.message;
      } else if (mode === 'signup' && !result.data.session) {
        errorDiv.style.color = '#3F9A40';
        errorDiv.textContent = 'Cuenta creada. Revisá tu email para confirmar.';
      }
      // Si hay sesión, onAuthStateChange se encarga de renderizar el juego
    });

    document.getElementById('google-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
    });
  }

  async function fetchQuestions(categoryId) {
    if (questionsCache[categoryId]) return questionsCache[categoryId];
    try {
      const { data, error } = await supabaseClient.from('questions').select('*').eq('category_id', categoryId);
      if (error || !data || data.length === 0) throw new Error('sin datos');
      questionsCache[categoryId] = data.map(q => ({ question: q.question, options: q.options, correct_index: q.correct_index, explanation: q.explanation }));
    } catch (e) {
      questionsCache[categoryId] = FALLBACK_QUESTIONS[categoryId] || [];
    }
    return questionsCache[categoryId];
  }

  function renderHome() {
    if (lives <= 0) { renderNoLives(); return; }

    const gradient = CATEGORIES.map((c, i) => {
      const start = (i * 100) / CATEGORIES.length;
      const end = ((i + 1) * 100) / CATEGORIES.length;
      return `${c.hex} ${start}% ${end}%`;
    }).join(', ');

    main.innerHTML = `
      ${dingSVG('bienvenida', 80)}
      <div class="serif" style="font-size:22px;">¿Listo para girar?</div>
      <p class="hint">Caé en una categoría y demostrá lo que sabés.</p>
      <div id="wheel-wrap">
        <div id="pointer"></div>
        <div id="wheel" style="background: conic-gradient(${gradient});"></div>
        <button id="spin-btn">GIRAR</button>
      </div>
    `;
    document.getElementById('spin-btn').addEventListener('click', spinWheel);
  }

  function renderNoLives() {
    const nextAt = player.next_life_at ? new Date(player.next_life_at).getTime() : null;
    let timeLeftStr = '';
    if (nextAt) {
      const msLeft = Math.max(0, nextAt - Date.now());
      const mins = Math.floor(msLeft / 60000);
      const secs = Math.floor((msLeft % 60000) / 1000);
      timeLeftStr = `${mins}:${secs.toString().padStart(2,'0')}`;
    }
    main.innerHTML = `
      ${dingSVG('gameover', 90)}
      <div class="serif" style="font-size:22px;">Sin corazones</div>
      <p class="hint">Tu próximo corazón está en camino.</p>
      <div class="mono" style="font-size:32px; margin-top:6px;" id="countdown">${timeLeftStr}</div>
      <p class="hint" style="margin-top:10px;">Volvé más tarde para seguir jugando.</p>
    `;
    const countdownEl = document.getElementById('countdown');
    const tick = setInterval(() => {
      lives = applyLifeRegen();
      if (lives > 0) {
        clearInterval(tick);
        updateHud();
        renderHome();
        return;
      }
      if (nextAt) {
        const msLeft = Math.max(0, nextAt - Date.now());
        const mins = Math.floor(msLeft / 60000);
        const secs = Math.floor((msLeft % 60000) / 1000);
        countdownEl.textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
      }
    }, 1000);
  }

  function spinWheel() {
    const btn = document.getElementById('spin-btn');
    const wheel = document.getElementById('wheel');
    btn.disabled = true;
    btn.textContent = '...';

    const randomIndex = Math.floor(Math.random() * CATEGORIES.length);
    const sliceAngle = 360 / CATEGORIES.length;
    const extraSpins = 5 * 360;
    const targetAngle = extraSpins + (360 - randomIndex * sliceAngle - sliceAngle / 2);
    wheel.style.transform = `rotate(${targetAngle}deg)`;

    setTimeout(async () => {
      currentCategory = CATEGORIES[randomIndex];
      const questions = await fetchQuestions(currentCategory.id);
      currentQuestion = questions[Math.floor(Math.random() * questions.length)];
      renderQuestion();
    }, 3300);
  }

  function renderQuestion() {
    if (!currentQuestion) {
      main.innerHTML = `<p>No hay preguntas cargadas para esta categoría todavía.</p>
        <button class="primary-btn dark" id="back-btn">Volver</button>`;
      document.getElementById('back-btn').addEventListener('click', renderHome);
      return;
    }
    const letters = ['A', 'B', 'C', 'D'];
    main.innerHTML = `
      <div style="width:100%;">
        <span class="category-tag" style="background:${currentCategory.hex}"><span class="dot"></span>${currentCategory.name}</span>
        <div style="margin: 12px 0;">${dingSVG('bienvenida', 48)}</div>
        <div id="question-text">${currentQuestion.question}</div>
        <div id="options-list" style="margin-top:16px;">
          ${currentQuestion.options.map((opt, i) => `
            <button class="option" data-index="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></button>
          `).join('')}
        </div>
      </div>
    `;
    document.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.index)));
    });
  }

  async function handleAnswer(index) {
    document.querySelectorAll('.option').forEach(btn => btn.disabled = true);
    const isCorrect = index === currentQuestion.correct_index;

    document.querySelectorAll('.option').forEach((btn, i) => {
      if (i === currentQuestion.correct_index) btn.classList.add('correct');
      else if (i === index && !isCorrect) btn.classList.add('incorrect');
    });

    sessionTotal += 1;
    if (isCorrect) sessionCorrect += 1;

    // Cada respuesta es como una "reseña": actualizamos el rating en el momento
    const stars = isCorrect ? STARS_CORRECT : STARS_INCORRECT;
    const oldRating = Number(player.rating);
    const oldReviews = player.total_reviews;
    const newReviews = oldReviews + 1;
    const newRating = ((oldRating * oldReviews) + stars) / newReviews;
    const ratingDelta = oldReviews > 0 ? newRating - oldRating : 0;

    player.rating = newRating;
    player.total_reviews = newReviews;
    await supabaseClient.from('players').update({ rating: newRating, total_reviews: newReviews }).eq('id', player.id);

    setTimeout(async () => {
      if (isCorrect) {
        streak += 1;
      } else {
        streak = 0;
        lives -= 1;
        await savePlayerLives(lives, lives < MAX_LIVES && !player.next_life_at ? new Date(Date.now() + LIFE_REGEN_MINUTES*60000).toISOString() : player.next_life_at);
      }
      updateHud();
      renderResult(isCorrect, stars, ratingDelta);
    }, 500);
  }

  function renderResult(isCorrect, stars, ratingDelta) {
    const deltaClass = ratingDelta >= 0 ? 'up' : 'down';
    const deltaSign = ratingDelta >= 0 ? '+' : '';
    const showDelta = player.total_reviews > 1; // recién a partir de la 2da reseña hay "delta" real

    if (lives <= 0) { renderGameOverScreen(); return; }

    main.innerHTML = `
      <span class="result-tag" style="color:${isCorrect ? '#3F9A40' : '#E8784A'}">${isCorrect ? '¡CORRECTO!' : 'CASI...'}</span>
      ${dingSVG(isCorrect ? 'correcto' : 'incorrecto', isCorrect ? 100 : 96)}
      <div class="stars-row">${Array.from({length:5}, (_,i) => starSVG(i < stars, 18)).join('')}</div>
      ${isCorrect && streak > 1 ? `<span class="streak-badge">🔥 RACHA x${streak}</span>` : ''}
      <div class="explanation" style="border-color:${isCorrect ? 'var(--c-aircover)' : 'var(--c-reservas)'}">
        <div class="label" style="color:${isCorrect ? '#3F9A40' : '#E8784A'}">POR QUÉ</div>
        <p>${currentQuestion.explanation}</p>
      </div>
      <div class="mono" style="font-size:13px; margin-top:10px;">
        Rating: ${Number(player.rating).toFixed(2)}
        ${showDelta ? `<span class="rating-delta ${deltaClass}">(${deltaSign}${ratingDelta.toFixed(2)})</span>` : ''}
      </div>
      <button class="primary-btn ${isCorrect ? 'correct' : 'dark'}" id="continue-btn">Siguiente pregunta →</button>
    `;
    document.getElementById('continue-btn').addEventListener('click', renderHome);
  }

  function renderGameOverScreen() {
    main.innerHTML = `
      ${dingSVG('gameover', 90)}
      <div class="serif" style="font-size:22px;">Sin corazones</div>
      <div class="mono" style="font-size:15px;">${sessionCorrect} / ${sessionTotal} correctas esta partida</div>
      <div class="explanation" style="text-align:center;">
        <div class="label">TU RATING GENERAL</div>
        <div class="mono" style="font-size:26px; margin-top:4px;">${Number(player.rating).toFixed(2)}</div>
        <p style="margin-top:6px;">Basado en ${player.total_reviews} ${player.total_reviews === 1 ? 'respuesta' : 'respuestas'}.</p>
      </div>
      <button class="primary-btn dark" id="ok-btn">Continuar</button>
    `;
    document.getElementById('ok-btn').addEventListener('click', () => {
      sessionCorrect = 0; sessionTotal = 0; streak = 0;
      updateHud();
      renderHome();
    });
  }

  init();
</script>
</body>
</html>
