<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Howtiq — El primer juego del mundo para hosts</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B2521;
    --bg-a: #FFFDF9;
    --bg-b: #F6ECDC;
    --card: #FFFFFF;
    --sand: #F4EADB;
    --c-reservas: #E8784A;
    --c-aircover: #6BCB6B;
    --c-contenido: #F5DE50;
    --c-comunicacion: #4CC3E8;
    --c-precios: #9B63C2;
    --c-actualizaciones: #E6A0E3;
    --c-cta: #FF385C;
    --c-cta-sh: #C21F42;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(130% 100% at 50% 0%, var(--bg-a) 0%, var(--bg-b) 60%, #F1E4D0 100%);
    color: var(--ink);
    font-family: 'Hanken Grotesk', sans-serif;
    max-width: 420px; margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  .serif { font-family: 'DM Serif Display', serif; }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes kpThink { 0%,100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
  @keyframes kpLean { 0%,100% { transform: translateX(0) rotate(-2deg); } 25% { transform: translateX(-3px) rotate(2deg); } 50% { transform: translateX(3px) rotate(-2deg); } 75% { transform: translateX(-2px) rotate(2deg); } }
  @keyframes kpCelebrate { 0%,100% { transform: translateY(0) scale(1); } 22% { transform: translateY(-16px) scale(1.05); } 44% { transform: translateY(0) scale(1); } 66% { transform: translateY(-8px); } }
  @keyframes kpStar { 0% { opacity: 0; transform: scale(.4) rotate(0); } 45% { opacity: 1; transform: scale(1.1) rotate(20deg); } 100% { opacity: 0; transform: scale(.6) rotate(40deg); } }
  @keyframes girarPulse { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.045); } }
  @keyframes popIn { 0% { opacity: 0; transform: scale(.8) translateY(6px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes tagPop { 0% { opacity: 0; transform: scale(.7) translateY(-10px); } 55% { opacity: 1; transform: scale(1.09) translateY(2px); } 80% { transform: scale(.97) translateY(0); } 100% { transform: scale(1) translateY(0); } }
  @keyframes fadeUp { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes doorKnobTurn { 0%, 100% { opacity: 1; transform: scale(1); } 45% { opacity: .55; transform: scale(.8); } 55% { opacity: 1; transform: scale(1.25); } }
  @keyframes doorLightGrow { 0%, 100% { opacity: .55; transform: scaleX(1); } 50% { opacity: .95; transform: scaleX(1.3); } }
  @keyframes needleSeek { 0%, 100% { transform: rotate(-33deg); } 50% { transform: rotate(-5deg); } }
  @keyframes spherePull { 0%, 100% { transform: translate(0, 0); } 18% { transform: translate(-1.4px, 1px); } 32% { transform: translate(1.4px, 2.3px); } 46% { transform: translate(-1px, 3.6px); } 60% { transform: translate(1px, 2.2px); } 78% { transform: translate(-0.6px, 1px); } }
  .icon-door-knob { transform-box: fill-box; transform-origin: center; animation: doorKnobTurn 2s ease-in-out infinite; }
  .icon-door-light { transform-box: fill-box; transform-origin: left; animation: doorLightGrow 2s ease-in-out infinite; }
  .icon-compass-needle { transform-box: view-box; transform-origin: 32px 32px; animation: needleSeek 1.8s ease-in-out infinite; }
  .icon-magnet-sphere { transform-box: fill-box; transform-origin: center; animation: spherePull 1.7s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .icon-door-knob, .icon-door-light, .icon-compass-needle, .icon-magnet-sphere { animation: none; }
  }

  .keeper-wrap { display: inline-block; animation: bob 2.6s ease-in-out infinite, popIn .4s cubic-bezier(.22,1,.36,1); transform-origin: 50% 92%; }
  .keeper-wrap.kp-think { animation: kpThink 2.4s ease-in-out infinite; }
  .keeper-wrap.kp-lean { animation: kpLean .45s ease-in-out infinite; }
  .keeper-wrap.kp-celebrate { animation: kpCelebrate 1.5s ease-in-out infinite; }
  .kp-star { animation: kpStar 1.6s ease-in-out infinite; }

  /* Wordmark: las "o" son diales de combinación */
  .wm { font-family: 'Baloo 2', cursive; font-weight: 800; color: var(--ink); letter-spacing: -.02em; display: inline-flex; align-items: center; line-height: 1; }
  .wm .dl { display: inline-block; border-radius: 50%; position: relative; box-sizing: border-box; border: .1em solid var(--ink); background: var(--dc, #E8784A); box-shadow: inset 0 0 0 .028em rgba(255,255,255,.7); margin: 0 .008em; }
  .wm .dl::before { content: ""; position: absolute; inset: -.1em; border-radius: 50%; background: repeating-conic-gradient(var(--ink) 0 3.5deg, transparent 3.5deg 30deg); -webkit-mask: radial-gradient(closest-side, transparent 76%, #000 78%); mask: radial-gradient(closest-side, transparent 76%, #000 78%); }
  .wm .dl::after { content: ""; position: absolute; top: -.19em; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: .085em solid transparent; border-right: .085em solid transparent; border-bottom: .13em solid var(--ink); }

  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 4px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 13px; border: none; background: rgba(43,37,33,.06); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s; flex: none; }
  .icon-btn:hover { background: rgba(43,37,33,.12); }

  #hud { padding: 12px 20px 0; position: relative; }
  .hud-row { display: flex; align-items: stretch; justify-content: center; gap: 10px; }
  .hud-pill {
    display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: 16px;
    padding: 9px 14px; box-shadow: 0 4px 12px -4px rgba(43,37,33,.2); position: relative;
  }
  .hud-pill.progress-pill { background: var(--sand); gap: 8px; }
  .progress-pill .pp-label {
    font: 800 9px 'Baloo 2'; text-transform: uppercase; letter-spacing: .4px; color: #B79B6E;
    border-right: 1px solid rgba(43,37,33,.12); padding-right: 8px; margin-right: 1px; line-height: 1.15;
  }
  #rating-display { font-family: 'Baloo 2'; font-weight: 800; font-size: 15px; }
  .info-btn { width: 17px; height: 17px; border-radius: 50%; border: none; background: rgba(43,37,33,.1); color: rgba(43,37,33,.55); font: 700 10px 'Hanken Grotesk'; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: 2px; flex: none; }
  #round-stars-display { display: flex; align-items: center; gap: 3px; }
  #round-stars-display .frac { margin-left: 4px; font-family: 'Baloo 2'; font-weight: 700; font-size: 13px; }
  #round-stars-display .frac span { color: rgba(43,37,33,.4); }
  .rating-tooltip {
    position: absolute; top: calc(100% + 8px); left: 12px; z-index: 20;
    width: 250px; background: var(--ink); color: #FBF6EC; border-radius: 14px; padding: 12px 14px;
    font: 500 12px/1.45 'Hanken Grotesk'; box-shadow: 0 10px 24px -8px rgba(0,0,0,.4);
    opacity: 0; transform: translateY(-6px); pointer-events: none; transition: .15s;
  }
  .rating-tooltip.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .rating-tooltip::before { content: ""; position: absolute; top: -6px; left: 16px; width: 12px; height: 12px; background: var(--ink); transform: rotate(45deg); }
  .rating-tooltip b { color: #F5C020; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 20px 24px 24px; gap: 14px; text-align: center;
  }
  .home-stack { display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; }

  .ding-svg { display: block; margin: 0 auto; }
  .hint { font-size: 13px; color: rgba(43,37,33,.55); max-width: 280px; line-height: 1.4; }
  .home-title { font-family: 'Baloo 2'; font-weight: 800; font-size: 26px; line-height: 1; margin-top: 2px; }

  /* Login */
  .auth-box { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .auth-input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 2px solid rgba(43,37,33,.15); font: 500 14px 'Hanken Grotesk'; background: var(--card); }
  .btn3d { border: none; border-radius: 17px; font-family: 'Baloo 2', cursive; font-weight: 700; color: #fff; cursor: pointer; box-shadow: 0 5px 0 var(--sh, rgba(0,0,0,.2)); transition: transform .08s, box-shadow .08s; width: 100%; padding: 14px; }
  .btn3d:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sh, rgba(0,0,0,.2)); }
  .btn-google { background: var(--card); border: 2px solid rgba(43,37,33,.15); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px; border-radius: 17px; font: 700 14px 'Hanken Grotesk'; cursor: pointer; }
  .auth-toggle { font: 600 12px 'Hanken Grotesk'; color: var(--c-comunicacion); background: none; border: none; cursor: pointer; text-decoration: underline; }
  .auth-error { font: 600 12px 'Hanken Grotesk'; color: var(--c-reservas); }

  #wheel-wrap {
    position: relative; width: 236px; height: 236px; margin: 8px auto 0;
    border-radius: 50%; background: #FBF6EC; box-sizing: border-box; padding: 11px;
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.8),
      inset 0 -5px 9px rgba(43,37,33,.14),
      0 22px 42px -16px rgba(43,37,33,.55),
      0 8px 18px -8px rgba(43,37,33,.35);
  }
  #pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); z-index: 8; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid var(--ink); filter: drop-shadow(0 3px 2px rgba(43,37,33,.25)); }
  #wheel { width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 3px 7px rgba(43,37,33,.2), 0 4px 10px -5px rgba(43,37,33,.3); transition: transform 3.2s cubic-bezier(.15,.9,.25,1); position: relative; }
  .wheel-icons { position: absolute; inset: 0; }
  .wheel-icon { position: absolute; top: 50%; left: 50%; margin: -13px; width: 26px; height: 26px; border-radius: 50%; background: #FBF6EC; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,.18); }
  .girar {
    position: absolute; top: 50%; left: 50%; width: 92px; height: 92px; border-radius: 50%;
    border: none; background: radial-gradient(circle at 38% 30%, #FF6E86, var(--c-cta) 55%, #DE2749 100%);
    cursor: pointer; z-index: 6;
    box-shadow: 0 6px 0 var(--c-cta-sh), 0 12px 20px -7px rgba(43,37,33,.5);
    animation: girarPulse 2.6s ease-in-out infinite;
    display: flex; align-items: center; justify-content: center;
    transition: transform .08s, box-shadow .08s;
  }
  .girar::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); pointer-events: none; }
  .girar::after { content: ""; position: absolute; top: 10px; left: 18px; width: 30px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.35); filter: blur(2px); pointer-events: none; }
  .girar span { position: relative; font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 17px; color: #fff; letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0,0,0,.16); }
  .girar:active { transform: translate(-50%, calc(-50% + 5px)) scale(.96); box-shadow: 0 1px 0 var(--c-cta-sh), 0 4px 10px -5px rgba(43,37,33,.4); animation: none; }
  .girar:disabled { opacity: .75; }

  .category-tag { display: inline-flex; align-items: center; gap: 9px; padding: 11px 22px; border-radius: 999px; font-family: 'Baloo 2'; font-weight: 700; font-size: 16px; color: var(--ink); text-transform: uppercase; letter-spacing: .3px; box-shadow: 0 4px 10px -3px rgba(43,37,33,.28); animation: tagPop .5s cubic-bezier(.22,1,.36,1); }

  #question-text { font-family: 'Baloo 2'; font-weight: 600; font-size: 19px; line-height: 1.25; text-align: left; width: 100%; animation: fadeUp .35s ease; }
  #options-list { width: 100%; display: flex; flex-direction: column; gap: 9px; text-align: left; }
  .option { display: flex; align-items: center; gap: 11px; padding: 13px 14px; border-radius: 15px; border: 2px solid rgba(43,37,33,.12); background: var(--card); cursor: pointer; font: 600 13.5px 'Hanken Grotesk'; width: 100%; transition: .15s; }
  .option:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-2px); }
  .option .letter { width: 27px; height: 27px; flex: none; border-radius: 9px; background: var(--sand); display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2'; font-weight: 700; font-size: 13px; color: #B79B6E; }
  .option.correct { border-color: var(--c-aircover); background: #EAF8EA; }
  .option.incorrect { border-color: var(--c-reservas); background: #FCEEE7; }

  .result-tag { font-family: 'Baloo 2'; font-weight: 700; font-size: 13px; letter-spacing: 1px; margin-bottom: 20px; }
  .result-title { font-family: 'Baloo 2'; font-weight: 800; font-size: 25px; margin-top: 2px; }
  .streak-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; background: var(--c-reservas); color: #fff; padding: 5px 13px; border-radius: 999px; font: 700 12px 'Hanken Grotesk'; }

  .explanation { margin-top: 14px; text-align: left; background: var(--card); border: 1.5px solid rgba(43,37,33,.1); border-radius: 16px; padding: 16px; width: 100%; }
  .explanation .label { font: 800 10px 'Hanken Grotesk'; letter-spacing: 1px; margin-bottom: 6px; color: rgba(43,37,33,.5); }
  .explanation p { font: 500 13.5px/1.5 'Hanken Grotesk'; }

  .primary-btn { margin-top: 18px; width: 100%; padding: 15px; border: none; border-radius: 17px; font-family: 'Baloo 2'; font-weight: 700; font-size: 17px; cursor: pointer; box-shadow: 0 5px 0 var(--sh, rgba(0,0,0,.2)); transition: transform .08s, box-shadow .08s; }
  .primary-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sh, rgba(0,0,0,.2)); }
  .primary-btn:disabled { opacity: .5; cursor: default; }
  .primary-btn.dark { background: var(--ink); color: #fff; --sh: #000; }
  .primary-btn.correct { background: var(--c-aircover); color: #12420F; --sh: #4A9A4A; }
  .primary-btn.warm { background: var(--c-reservas); color: #fff; --sh: #B4542E; }
  .primary-btn.cta { background: var(--c-cta); color: #fff; --sh: var(--c-cta-sh); }

  .stars-row { display: flex; gap: 4px; justify-content: center; margin: 6px 0; }
  .rating-delta { font-family: 'Baloo 2'; font-weight: 700; font-size: 13px; }
  .rating-delta.up { color: #3F9A40; }
  .rating-delta.down { color: var(--c-reservas); }

  /* Badge estilo reseña de Airbnb */
  .review-badge { width: 100%; margin-top: 6px; background: var(--card); border-radius: 20px; box-shadow: 0 8px 22px -10px rgba(43,37,33,.3); display: flex; align-items: stretch; padding: 15px 6px; animation: fadeUp .4s ease; }
  .review-badge .seg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 6px; }
  .review-badge .seg.fav { flex: 1.3; }
  .review-badge .divider { width: 1px; background: rgba(43,37,33,.12); margin: 6px 0; }
  .review-badge .seg-label { font: 700 10.5px 'Hanken Grotesk'; line-height: 1.2; text-align: center; }
  .review-badge .seg-number { font-family: 'Baloo 2'; font-weight: 800; font-size: 30px; line-height: .9; }
  .review-badge .seg-sub { font: 600 10px 'Hanken Grotesk'; color: rgba(43,37,33,.6); }
</style>
</head>
<body>

<header>
  <div class="wm" id="logo-home-btn" style="font-size:24px; cursor:pointer; gap:8px;">
    <span style="width:36px; height:36px; border-radius:11px; overflow:hidden; display:flex; align-items:center; justify-content:center; flex:none;">
      <img src="android-chrome-192x192.png" alt="Keeper" style="width:100%; height:100%; object-fit:cover; display:block;" />
    </span>
    <span>Howtiq</span>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="icon-btn" id="mode-badge-btn" style="display:none; padding:4px;" title=""></button>
    <button class="icon-btn" id="sources-btn" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="10.5" x2="12" y2="16"/><circle cx="12" cy="7.3" r="0.6" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="icon-btn" id="ranking-btn" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a2 2 0 0 0 2 4M17 6h3a2 2 0 0 1-2 4"/></svg>
    </button>
  </div>
</header>

<div id="sources-modal" style="display:none; position:fixed; inset:0; z-index:50; align-items:center; justify-content:center; padding:24px; background:rgba(43,37,33,.5);">
  <div style="background:var(--card); border-radius:20px; padding:24px; max-width:380px; max-height:80vh; overflow-y:auto; box-shadow:0 20px 50px -12px rgba(0,0,0,.4);">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <span style="font-family:'Baloo 2'; font-weight:800; font-size:19px;" id="sources-title"></span>
      <button id="sources-close-btn" style="border:none; background:rgba(43,37,33,.08); width:30px; height:30px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
    </div>
    <div id="sources-body" style="font:500 13.5px/1.55 'Hanken Grotesk'; color:rgba(43,37,33,.85); text-align:left;"></div>
  </div>
</div>

<div id="hud" style="display:none;">
  <div class="hud-row">
    <div class="hud-pill">
      <span id="star-icon"></span><span id="rating-display">—</span>
      <button class="info-btn" id="rating-info-btn">i</button>
    </div>
    <div class="hud-pill progress-pill">
      <span class="pp-label" id="round-label"></span>
      <span id="round-stars-display"></span>
    </div>
  </div>
  <div class="rating-tooltip" id="rating-tooltip"></div>
</div>

<main id="main"></main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <radialGradient id="k2Shadow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2B2521" stop-opacity="0.2"/><stop offset="70%" stop-color="#2B2521" stop-opacity="0.07"/><stop offset="100%" stop-color="#2B2521" stop-opacity="0"/></radialGradient>
  <linearGradient id="k2Rubber" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5A5A60"/><stop offset="52%" stop-color="#35353B"/><stop offset="100%" stop-color="#222228"/></linearGradient>
  <linearGradient id="k2Silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F5F7"/><stop offset="35%" stop-color="#DBDDE1"/><stop offset="72%" stop-color="#B6B8BE"/><stop offset="100%" stop-color="#CCCED2"/></linearGradient>
  <linearGradient id="k2Shackle" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#70707A"/><stop offset="45%" stop-color="#3C3C42"/><stop offset="100%" stop-color="#171719"/></linearGradient>
  <linearGradient id="k2Wheel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EFEFF1"/><stop offset="50%" stop-color="#ABABB0"/><stop offset="100%" stop-color="#DADAE0"/></linearGradient>
  <linearGradient id="k2Arm" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#42424A"/><stop offset="100%" stop-color="#242429"/></linearGradient>
  <linearGradient id="k2Gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FCE9A6"/><stop offset="48%" stop-color="#E8B23C"/><stop offset="100%" stop-color="#B77E1E"/></linearGradient>
  <symbol id="k2Body" viewBox="0 0 170 210">
    <ellipse cx="85" cy="200" rx="50" ry="9" fill="url(#k2Shadow)"/>

  // ====== Keeper: candado-mascota, "un personaje, muchas caras" ======
  // ====== Keeper: mascota real en foto/render 3D, "un personaje, muchas caras" ======
  // ====== Sonido: generado en vivo con Web Audio API, sin archivos externos ======
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, duration, type, volume, delay) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      const startAt = ctx.currentTime + (delay || 0);
      gain.gain.setValueAtTime(volume || 0.15, startAt);
      gain.gain.exponentialRampToValueAtTime(0.001, startAt + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startAt);
      osc.stop(startAt + duration);
    } catch (e) { /* audio no disponible, seguimos sin sonido */ }
  }

  function playSpinSound(totalSeconds) {
    let elapsed = 0;
    const minGap = 0.05, maxGap = 0.26;
    while (elapsed < totalSeconds) {
      const progress = elapsed / totalSeconds;
      playTone(1000, 0.025, 'square', 0.06, elapsed);
      elapsed += minGap + (maxGap - minGap) * progress;
    }
  }

  function playCorrectSound() {
    playTone(523.25, 0.11, 'sine', 0.16, 0);
    playTone(659.25, 0.11, 'sine', 0.16, 0.09);
    playTone(783.99, 0.2, 'sine', 0.18, 0.18);
  }

  function playIncorrectSound() {
    playTone(300, 0.16, 'sawtooth', 0.12, 0);
    playTone(210, 0.24, 'sawtooth', 0.12, 0.11);
  }

  function keeperImg(pose, size, animClass) {

  // ====== TARJETA COMPARTIBLE (canvas, formato feed 4:5) ======
  function loadImageAsync(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null); // si falla, seguimos sin la imagen en vez de romper todo
      img.src = src;
    });
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  async function buildShareCard(type) {
    const W = 1080, H = 1920;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    // fondo cálido en degradé
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#FFF6E7');
    bgGrad.addColorStop(1, '#FBDFAE');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    const mode = MODES.find(m => m.id === currentMode) || MODES[0];
    const modeName = lang === 'en' ? mode.name_en : mode.name;

    // wordmark Howtiq
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = "800 56px 'Baloo 2'";
    ctx.fillStyle = '#2B2521';
    ctx.fillText('How', 80, 150);
    const howW = ctx.measureText('How').width;
    ctx.fillStyle = '#FF385C';
    ctx.fillText('tiq', 80 + howW, 150);

    // badge de Modo, arriba a la derecha — solo ícono + nombre, sin categoría
    ctx.font = "700 30px 'Hanken Grotesk'";
    const chipPad = 26, chipDot = 20, chipH = 68;
    const chipTextW = ctx.measureText(modeName).width;
    const chipW = chipTextW + chipPad * 2 + chipDot + 14;
    const chipX = W - 80 - chipW, chipY = 90;
    ctx.fillStyle = '#FFFFFF';
    roundRectPath(ctx, chipX, chipY, chipW, chipH, chipH / 2);
    ctx.fill();
    ctx.fillStyle = mode.accent;
    ctx.beginPath();
    ctx.arc(chipX + chipPad + chipDot / 2, chipY + chipH / 2, chipDot / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2B2521';
    ctx.fillText(modeName, chipX + chipPad + chipDot + 14, chipY + chipH / 2 + 11);

    // Keeper festejando, grande y centrado
    const keeperPose = type === 'perfect' ? 'nivel' : 'racha';
    const keeper = await loadImageAsync(`keeper-${keeperPose}.png`);
    if (keeper) {
      const kW = 620;
      const kH = kW * (keeper.height / keeper.width);
      ctx.drawImage(keeper, (W - kW) / 2, 340, kW, kH);
    }

    ctx.textAlign = 'center';
    let y = 1230;

    if (type === 'perfect') {
      ctx.font = "800 40px 'Hanken Grotesk'";
      ctx.fillStyle = '#FF385C';
      ctx.fillText(t('perfectRound').toUpperCase(), W / 2, y);
      y += 150;
      ctx.font = "800 130px 'Baloo 2'";
      ctx.fillStyle = '#2B2521';
      ctx.fillText(`${roundCorrect}/${ROUND_LENGTH}`, W / 2, y);
      y += 130;
    } else {
      ctx.font = "700 34px 'Hanken Grotesk'";
      ctx.fillStyle = '#8A7A5C';
      ctx.fillText('★ ' + Number(modeStats.rating).toFixed(2) + ' — ' + t('ratingLabel'), W / 2, y);
      y += 90;
      ctx.font = "800 70px 'Baloo 2'";
      ctx.fillStyle = '#FF385C';
      ctx.fillText(t('favWithHosts'), W / 2, y);
      y += 110;
    }

    // botón CTA "Jugá vos también"
    const ctaText = t('shareCta');
    ctx.font = "800 38px 'Baloo 2'";
    const ctaTextW = ctx.measureText(ctaText).width;
    const ctaW = ctaTextW + 128, ctaH = 104;
    const ctaX = W / 2 - ctaW / 2, ctaY = y;
    ctx.fillStyle = '#FF385C';
    roundRectPath(ctx, ctaX, ctaY, ctaW, ctaH, ctaH / 2);
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(ctaText, W / 2, ctaY + ctaH / 2 + 13);
    y = ctaY + ctaH + 64;

    // howtiq.com — es la puerta real de entrada al juego
    ctx.font = "700 32px 'Hanken Grotesk'";
    ctx.fillStyle = 'rgba(43,37,33,.55)';
    ctx.fillText('howtiq.com', W / 2, y);

    return canvas;
  }

  async function shareResultCard(type, btnEl) {
    const originalText = btnEl.textContent;
    btnEl.textContent = t('generatingCard');
    btnEl.disabled = true;
    try {
      const canvas = await buildShareCard(type);
      canvas.toBlob(async (blob) => {
        if (!blob) { btnEl.textContent = originalText; btnEl.disabled = false; return; }
        const file = new File([blob], 'howtiq.png', { type: 'image/png' });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Howtiq' });
          } catch (e) { /* el usuario canceló el share nativo, no hacemos nada */ }
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'howtiq.png';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
        btnEl.textContent = originalText;
        btnEl.disabled = false;
      }, 'image/png');
    } catch (e) {
      btnEl.textContent = originalText;
      btnEl.disabled = false;
    }
  }

        return;
      }
      const { error: updateError } = await supabaseClient.from('players').update({ nickname: raw }).eq('id', player.id);
      if (updateError) {
        errorDiv.textContent = t('nicknameTaken');
        submitBtn.disabled = false;
        submitBtn.textContent = t('continueBtn');
        return;
      }
      player.nickname = raw;
      goToModeOrHome();
    });
  }

  document.getElementById('mode-badge-btn').addEventListener('click', renderModeSelect);

  rankingBtn.addEventListener('click', () => renderRanking(currentMode));

  async function renderRanking(activeModo) {
    activeModo = activeModo || currentMode;
    main.innerHTML = `<p class="hint">${t('loadingRanking')}</p>`;
    const { data, error } = await supabaseClient.rpc('get_leaderboard_by_mode', { modo_param: activeModo, limit_count: 20 });
    const rows = (data || []);

    const rowsHtml = rows.map((r, i) => {
      const isMe = player.nickname && r.nickname === player.nickname;
      return `
        <div style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; background:${isMe ? 'var(--sand)' : 'var(--card)'}; box-shadow:0 2px 6px -3px rgba(43,37,33,.15);">
          <span style="font-family:'Baloo 2'; font-weight:800; font-size:14px; width:22px; color:rgba(43,37,33,.5);">${i + 1}</span>
          <span style="flex:1; text-align:left; font:700 13.5px 'Hanken Grotesk';">@${r.nickname}${isMe ? t('you') : ''}</span>
          <span style="font-family:'Baloo 2'; font-weight:800; font-size:14px; display:flex; align-items:center; gap:4px;">${starSVG(true, 13, '#F5C020')}${Number(r.rating).toFixed(2)}</span>
          <span style="font:600 11px 'Hanken Grotesk'; color:rgba(43,37,33,.45); width:52px; text-align:right;">${r.total_reviews} ${t('part')}</span>
        </div>
      `;
    }).join('');

    const tabsHtml = MODES.map(m => {
      const isActive = m.id === activeModo;
      const mName = lang === 'en' ? m.name_en : m.name;
      return `
        <button class="ranking-tab" data-modo="${m.id}" style="
          flex:1; padding:8px 4px; border:none; border-radius:11px; cursor:pointer;
          background:${isActive ? 'var(--card)' : 'transparent'};
          box-shadow:${isActive ? '0 2px 6px -2px rgba(43,37,33,.2)' : 'none'};
          font:700 11.5px 'Hanken Grotesk'; color:${isActive ? m.accent : 'rgba(43,37,33,.45)'};
        ">${mName}</button>
      `;
    }).join('');

    main.innerHTML = `
      <div class="home-title" style="font-size:21px;">${t('rankingTitle')}</div>
      <p class="hint">${t('rankingHint')}</p>
      <div style="display:flex; gap:5px; width:100%; background:var(--sand); border-radius:13px; padding:4px; margin-top:10px;">
        ${tabsHtml}
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; width:100%; margin-top:10px; max-height:50vh; overflow-y:auto;">
        ${rowsHtml || `<p class="hint">${t('noRanking')}</p>`}
      </div>
      <button class="primary-btn dark" id="ranking-back-btn">${t('back')}</button>
    `;
    document.querySelectorAll('.ranking-tab').forEach(btn => {
      btn.addEventListener('click', () => renderRanking(btn.dataset.modo));
    });
    document.getElementById('ranking-back-btn').addEventListener('click', renderHome);
  }

  function renderLogin() {
    main.innerHTML = `
      ${keeperImg('bienvenida', 84)}
      <div class="home-title" style="font-size:24px;">${t('loginTitle')}</div>
      <p class="hint">${t('loginHint')}</p>
      <div class="auth-box">
        <input class="auth-input" id="email-input" type="email" placeholder="${t('emailPh')}" />
        <input class="auth-input" id="password-input" type="password" placeholder="${t('passPh')}" />
        <div class="auth-error" id="auth-error"></div>
        <button class="btn3d" style="background:var(--ink);--sh:#000;" id="submit-btn">${t('loginBtn')}</button>
        <button class="auth-toggle" id="toggle-mode">${t('toggleToSignup')}</button>
        <div style="display:flex; align-items:center; gap:10px; margin:6px 0;">
          <div style="flex:1;height:1px;background:rgba(43,37,33,.15);"></div>
          <span style="font-size:11px;color:rgba(43,37,33,.4);">${lang === 'en' ? 'or' : 'o'}</span>
          <div style="flex:1;height:1px;background:rgba(43,37,33,.15);"></div>
        </div>
        <button class="btn-google" id="google-btn">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.7 35.4 27 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.5l6.6 5.4C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          ${t('googleBtn')}
        </button>
      </div>
    `;

    let mode = 'login';
    const toggleBtn = document.getElementById('toggle-mode');
    const submitBtn = document.getElementById('submit-btn');
    const errorDiv = document.getElementById('auth-error');

    toggleBtn.addEventListener('click', () => {
      mode = mode === 'login' ? 'signup' : 'login';
      submitBtn.textContent = mode === 'login' ? t('loginBtn') : t('signupBtn');
      toggleBtn.textContent = mode === 'login' ? t('toggleToSignup') : t('toggleToLogin');
      errorDiv.textContent = '';
    });

    submitBtn.addEventListener('click', async () => {
      errorDiv.textContent = '';
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      if (!email || !password) { errorDiv.textContent = t('fillBoth'); return; }
      submitBtn.disabled = true;
      submitBtn.textContent = '...';
      let result;
      if (mode === 'login') {
        result = await supabaseClient.auth.signInWithPassword({ email, password });
      } else {
        result = await supabaseClient.auth.signUp({ email, password });
      }
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'login' ? t('loginBtn') : t('signupBtn');
      if (result.error) {
        errorDiv.textContent = result.error.message;
      } else if (mode === 'signup' && !result.data.session) {
        errorDiv.style.color = '#3F9A40';
        errorDiv.textContent = t('accountCreated');
      }
      // Si hay sesión, onAuthStateChange se encarga de renderizar el juego
    });

    document.getElementById('google-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
    });
  }

  async function fetchQuestions(categoryId) {
    const cacheKey = categoryId + ':' + lang;
    if (questionsCache[cacheKey]) return questionsCache[cacheKey];
    try {
      const { data, error } = await supabaseClient.from('questions').select('*').eq('category_id', categoryId);
      if (error || !data || data.length === 0) throw new Error('sin datos');
      questionsCache[cacheKey] = data.map(q => {
        if (lang === 'en' && q.question_en && q.options_en) {
          return { question: q.question_en, options: q.options_en, correct_index: q.correct_index, explanation: q.explanation_en || q.explanation };
        }
        return { question: q.question, options: q.options, correct_index: q.correct_index, explanation: q.explanation };
      });
    } catch (e) {
      questionsCache[cacheKey] = (lang === 'en' ? FALLBACK_QUESTIONS_EN[categoryId] : FALLBACK_QUESTIONS[categoryId]) || [];
    }
    return questionsCache[cacheKey];
  }

  function renderHome() {
    hud.style.display = 'flex';
    updateHud();
    updateModeBadge();
    const cats = CATEGORIES_BY_MODE[currentMode] || [];

    if (cats.length === 0) {
      main.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; flex:1; width:100%; justify-content:center;">
          ${keeperImg('bienvenida', 100)}
          <div class="home-title" style="margin-top:8px;">${t('modeSoonTitle')}</div>
          <p class="hint" style="margin-top:2px;">${t('modeSoonHint')}</p>
          <button class="primary-btn dark" id="back-to-mode-btn" style="margin-top:16px;">${t('modeChange')}</button>
        </div>
      `;
      document.getElementById('back-to-mode-btn').addEventListener('click', renderModeSelect);
      return;
    }

    const gradient = cats.map((c, i) => {
      const start = (i * 100) / cats.length;
      const end = ((i + 1) * 100) / cats.length;
      return `${c.hex} ${start}% ${end}%`;
    }).join(', ');

    const sliceAngle = 360 / cats.length;
    const iconsHtml = cats.map((c, i) => {
      const angle = sliceAngle * i + sliceAngle / 2;
      return `<span class="wheel-icon" style="transform:rotate(${angle}deg) translateY(-77px) rotate(-${angle}deg);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${c.dark}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg>
      </span>`;
    }).join('');

    main.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; flex:1; width:100%;">
        <div style="flex:.7;"></div>
        ${keeperImg('bienvenida', 108)}
        <div class="home-title" style="margin-top:8px;">${t('homeTitle')}</div>
        <p class="hint" style="margin-top:2px;">${t('homeHint')}</p>
        <div id="wheel-wrap" style="margin-top:20px;">
          <div id="pointer"></div>
          <div id="wheel" style="background: conic-gradient(${gradient});">
            <div class="wheel-icons">${iconsHtml}</div>
          </div>
          <button class="girar" id="spin-btn"><span>${t('girar')}</span></button>
        </div>
        <div style="flex:.85;"></div>
      </div>
    `;
    document.getElementById('spin-btn').addEventListener('click', spinWheel);
  }

  function startNewRound() {
    roundIndex = 0;
    roundCorrect = 0;
    roundResults = [];
    streak = 0;
    renderHome();
  }

  function spinWheel() {
    const btn = document.getElementById('spin-btn');
    const wheel = document.getElementById('wheel');
    const keeperEl = main.querySelector('.keeper-wrap');
    btn.disabled = true;
    if (keeperEl) keeperEl.classList.add('kp-lean');
    playSpinSound(3.3);

    const cats = CATEGORIES_BY_MODE[currentMode] || [];
    const randomIndex = Math.floor(Math.random() * cats.length);
    const sliceAngle = 360 / cats.length;
    const extraSpins = 5 * 360;
    const targetAngle = extraSpins + (360 - randomIndex * sliceAngle - sliceAngle / 2);
    wheel.style.transform = `rotate(${targetAngle}deg)`;

    setTimeout(async () => {
      if (keeperEl) {
        keeperEl.classList.remove('kp-lean');
        keeperEl.classList.add('kp-celebrate');
      }
      currentCategory = cats[randomIndex];
      const questions = await fetchQuestions(currentCategory.id);
      const picked = questions[Math.floor(Math.random() * questions.length)];
      currentQuestion = shuffleQuestionOptions(picked);
      setTimeout(() => renderQuestion(), 550);
    }, 3300);
  }

  function shuffleQuestionOptions(q) {
    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    return {
      ...q,
      options: order.map(i => q.options[i]),
      correct_index: order.indexOf(q.correct_index)
    };
  }

  function renderQuestion() {
    if (!currentQuestion) {
      main.innerHTML = `<p>${t('noQuestions')}</p>
        <button class="primary-btn dark" id="back-btn">${t('back')}</button>`;
      document.getElementById('back-btn').addEventListener('click', renderHome);
      return;
    }
    const letters = ['A', 'B', 'C', 'D'];
    main.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; flex:1; width:100%;">
        <div style="flex:.32;"></div>
        <div style="width:100%;">
          <span class="category-tag" style="background:${currentCategory.hex}">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round">${currentCategory.icon}</svg>
            ${lang === 'en' ? currentCategory.name_en : currentCategory.name}
          </span>
          <div style="margin: 28px 0 16px; display:flex; gap:12px; align-items:center; text-align:left;">
            ${keeperImg('bienvenida', 56, 'kp-think')}
            <div id="question-text" style="margin:0;">${currentQuestion.question}</div>
          </div>
          <div id="options-list" style="margin-top:16px;">
            ${currentQuestion.options.map((opt, i) => `
              <button class="option" data-index="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></button>
            `).join('')}
          </div>
        </div>
        <div style="flex:.9;"></div>
      </div>
    `;
    document.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.index)));
    });
  }

  function handleAnswer(index) {
    document.querySelectorAll('.option').forEach(btn => btn.disabled = true);
    const isCorrect = index === currentQuestion.correct_index;

    document.querySelectorAll('.option').forEach((btn, i) => {
      if (i === currentQuestion.correct_index) btn.classList.add('correct');
      else if (i === index && !isCorrect) btn.classList.add('incorrect');
    });

    if (isCorrect) { playCorrectSound(); } else { playIncorrectSound(); }
    roundResults[roundIndex] = isCorrect;
    if (isCorrect) { roundCorrect += 1; streak += 1; } else { streak = 0; }
    roundIndex += 1;
    updateHud();

    setTimeout(() => {
      renderResult(isCorrect);
    }, 500);
  }

  function renderResult(isCorrect) {
    const isLastQuestion = roundIndex >= ROUND_LENGTH;
    const streakLabel = lang === 'en' ? 'STREAK' : 'RACHA';

    main.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; flex:1; width:100%;">
        <div style="flex:.6;"></div>
        <span class="result-tag" style="color:${isCorrect ? '#3F9A40' : '#E8784A'}">${isCorrect ? t('correct') : t('almost')}</span>
        ${keeperImg(isCorrect ? (streak > 1 ? 'racha' : 'correcto') : 'incorrecto', isCorrect ? 100 : 96)}
        ${isCorrect && streak > 1 ? `<span class="streak-badge">🔥 ${streakLabel} x${streak}</span>` : ''}
        <div class="explanation" style="border-color:${isCorrect ? 'var(--c-aircover)' : 'var(--c-reservas)'}">
          <div class="label" style="color:${isCorrect ? '#3F9A40' : '#E8784A'}">${t('why')}</div>
          <p>${currentQuestion.explanation}</p>
        </div>
        <button class="primary-btn ${isCorrect ? 'correct' : 'dark'}" id="continue-btn">${isLastQuestion ? t('seeResult') : t('nextQuestion')}</button>
        <div style="flex:.9;"></div>
      </div>
    `;
    document.getElementById('continue-btn').addEventListener('click', () => {
      if (isLastQuestion) {
        finishRound();
      } else {
        renderHome();
      }
    });
  }

  function reviewBadge(showFavorito) {
    if (showFavorito) {
      return `
        <div class="review-badge">
          <div class="seg fav">
            <div style="display:flex;align-items:center;justify-content:center;height:34px;">
              <svg width="18" height="36" viewBox="0 0 40 80"><use href="#laurelL"/></svg>
              <svg width="18" height="36" viewBox="0 0 40 80" style="transform:scaleX(-1)"><use href="#laurelL"/></svg>
            </div>
            <div class="seg-label">${t('favWithHosts')}</div>
          </div>
          <div class="divider"></div>
          <div class="seg">
            <div class="seg-number">${Number(modeStats.rating).toFixed(2)}</div>
            <div class="stars-row" style="margin:0;">${Array.from({length:5}, () => starSVG(true, 11)).join('')}</div>
          </div>
          <div class="divider"></div>
          <div class="seg">
            <div class="seg-number">${modeStats.total_reviews}</div>
            <div class="seg-sub">${t('partidas')}</div>
          </div>
        </div>`;
    }
    return `
      <div class="review-badge">
        <div class="seg">
          <div class="seg-number">${Number(modeStats.rating).toFixed(2)}</div>
          <div class="stars-row" style="margin:0;">${Array.from({length:5}, (_,i) => starSVG(i < Math.round(modeStats.rating), 12)).join('')}</div>
        </div>
        <div class="divider"></div>
        <div class="seg">
          <div class="seg-number">${modeStats.total_reviews}</div>
          <div class="seg-sub">${t('partidas')}</div>
        </div>
      </div>`;
  }

  // ====== FIN DE PARTIDA: la ronda completa es la "reseña" (0 a ROUND_LENGTH estrellas), por Modo ======
  async function finishRound() {
    const roundStars = roundCorrect; // 0 a 5, una estrella por pregunta acertada
    const oldRating = Number(modeStats.rating);
    const oldRounds = modeStats.total_reviews;
    const newRounds = oldRounds + 1;
    const newRating = ((oldRating * oldRounds) + roundStars) / newRounds;
    const ratingDelta = oldRounds > 0 ? newRating - oldRating : 0;
    const wasPerfect = roundStars === ROUND_LENGTH;

    const nowIso = new Date().toISOString();
    modeStats = { rating: newRating, total_reviews: newRounds };
    await supabaseClient.from('player_stats').upsert({
      player_id: player.id, modo: currentMode, rating: newRating, total_reviews: newRounds, last_played_at: nowIso
    }, { onConflict: 'player_id,modo' });

    const deltaClass = ratingDelta >= 0 ? 'up' : 'down';
    const deltaSign = ratingDelta >= 0 ? '+' : '';
    const showDelta = oldRounds > 0;
    // Igual que "Favorito entre huéspedes" de Airbnb: mínimo de partidas jugadas + rating sostenido alto
    const isFavorito = newRounds >= FAVORITE_MIN_ROUNDS && newRating >= FAVORITE_MIN_RATING;
    const roundsToGo = Math.max(0, FAVORITE_MIN_ROUNDS - newRounds);

    const pose = wasPerfect ? 'nivel' : (roundStars === 0 ? 'incorrecto' : 'correcto');
    const animClass = wasPerfect ? 'kp-celebrate' : undefined;

    const sparkles = wasPerfect ? `
      <div class="kp-star" style="position:absolute;top:6px;left:-6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#F5DE50"><path d="M12 2l2.2 6.6L21 9l-5 4 1.8 7L12 16l-5.8 4L8 13 3 9l6.8-.4z"/></svg></div>
      <div class="kp-star" style="position:absolute;top:14px;right:-4px;animation-delay:.5s;"><svg width="14" height="14" viewBox="0 0 24 24" fill="#4CC3E8"><path d="M12 2l2.2 6.6L21 9l-5 4 1.8 7L12 16l-5.8 4L8 13 3 9l6.8-.4z"/></svg></div>
    ` : '';

    let footerHint;
    if (isFavorito) {
      footerHint = t('keepFav');
    } else if (roundsToGo > 0) {
      footerHint = t('moreRoundsNeeded')(roundsToGo);
    } else {
      footerHint = t('raiseRating')(FAVORITE_MIN_RATING.toFixed(2));
    }

    const showShare = wasPerfect || isFavorito;
    const shareType = wasPerfect ? 'perfect' : 'favorite';

    main.innerHTML = `
      <div class="result-tag" style="color:${wasPerfect ? '#3F9A40' : (roundStars === 0 ? 'var(--c-reservas)' : 'var(--ink)')}">${wasPerfect ? t('perfectRound') : t('roundOver')}</div>
      <div style="position:relative; display:inline-block;">
        ${sparkles}
        ${keeperImg(pose, 110, animClass)}
      </div>
      <div class="result-title">${wasPerfect ? t('fiveOfFive') : t('ofCorrect')(roundCorrect, ROUND_LENGTH)}</div>
      ${reviewBadge(isFavorito)}
      ${showDelta ? `<div class="rating-delta ${deltaClass}">${deltaSign}${ratingDelta.toFixed(2)} ${t('thisRound')}</div>` : ''}
      <p class="hint">${footerHint}</p>
      <button class="primary-btn cta" id="again-btn">${t('playAgain')}</button>
      ${showShare ? `<button class="primary-btn dark" id="share-btn" style="margin-top:10px; display:flex; align-items:center; justify-content:center; gap:8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>
        ${t('shareBtn')}
      </button>` : ''}
    `;
    document.getElementById('again-btn').addEventListener('click', startNewRound);
    if (showShare) {
      const shareBtn = document.getElementById('share-btn');
      shareBtn.addEventListener('click', () => shareResultCard(shareType, shareBtn));
    }
  }

  init();
</script>
</body>
</html>
