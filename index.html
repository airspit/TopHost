<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>TopHost — El primer juego del mundo para anfitriones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B2521;
    --bg-a: #FFFDF9;
    --bg-b: #F6ECDC;
    --card: #FFFFFF;
    --sand: #F4EADB;
    --c-reservas: #E8784A;
    --c-aircover: #6BCB6B;
    --c-contenido: #F5DE50;
    --c-comunicacion: #4CC3E8;
    --c-precios: #9B63C2;
    --c-actualizaciones: #E6A0E3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(130% 100% at 50% 0%, var(--bg-a) 0%, var(--bg-b) 60%, #F1E4D0 100%);
    color: var(--ink);
    font-family: 'Hanken Grotesk', sans-serif;
    max-width: 420px; margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  .serif { font-family: 'DM Serif Display', serif; }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes kpThink { 0%,100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
  @keyframes kpLean { 0%,100% { transform: translateX(0) rotate(0); } 35% { transform: translateX(7px) rotate(5deg); } 70% { transform: translateX(4px) rotate(3deg); } }
  @keyframes kpCelebrate { 0%,100% { transform: translateY(0) scale(1); } 22% { transform: translateY(-16px) scale(1.05); } 44% { transform: translateY(0) scale(1); } 66% { transform: translateY(-8px); } }
  @keyframes kpStar { 0% { opacity: 0; transform: scale(.4) rotate(0); } 45% { opacity: 1; transform: scale(1.1) rotate(20deg); } 100% { opacity: 0; transform: scale(.6) rotate(40deg); } }
  @keyframes girarPulse { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.055); } }
  @keyframes popIn { 0% { opacity: 0; transform: scale(.8) translateY(6px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes fadeUp { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }

  .keeper-wrap { display: inline-block; animation: bob 2.6s ease-in-out infinite, popIn .4s cubic-bezier(.22,1,.36,1); transform-origin: 50% 92%; }
  .keeper-wrap.kp-think { animation: kpThink 2.4s ease-in-out infinite; }
  .keeper-wrap.kp-lean { animation: kpLean 1.1s ease-in-out infinite; }
  .keeper-wrap.kp-celebrate { animation: kpCelebrate 1.5s ease-in-out infinite; }
  .kp-star { animation: kpStar 1.6s ease-in-out infinite; }

  /* Wordmark: las "o" son diales de combinación */
  .wm { font-family: 'Baloo 2', cursive; font-weight: 800; color: var(--ink); letter-spacing: -.02em; display: inline-flex; align-items: center; line-height: 1; }
  .wm .dl { display: inline-block; border-radius: 50%; position: relative; box-sizing: border-box; border: .1em solid var(--ink); background: var(--dc, #E8784A); box-shadow: inset 0 0 0 .028em rgba(255,255,255,.7); margin: 0 .008em; }
  .wm .dl::before { content: ""; position: absolute; inset: -.1em; border-radius: 50%; background: repeating-conic-gradient(var(--ink) 0 3.5deg, transparent 3.5deg 30deg); -webkit-mask: radial-gradient(closest-side, transparent 76%, #000 78%); mask: radial-gradient(closest-side, transparent 76%, #000 78%); }
  .wm .dl::after { content: ""; position: absolute; top: -.19em; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: .085em solid transparent; border-right: .085em solid transparent; border-bottom: .13em solid var(--ink); }

  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 4px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 13px; border: none; background: rgba(43,37,33,.06); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s; flex: none; }
  .icon-btn:hover { background: rgba(43,37,33,.12); }

  #hud { display: flex; align-items: center; gap: 8px; padding: 12px 20px 0; }
  .pill { display: flex; align-items: center; gap: 5px; background: var(--card); border-radius: 999px; padding: 6px 12px; box-shadow: 0 2px 6px -2px rgba(43,37,33,.18); }
  #hud .round-stars { flex: 1; justify-content: center; gap: 3px; }
  #hud .round-stars .frac { margin-left: 4px; font-family: 'Baloo 2'; font-weight: 700; font-size: 13px; }
  #hud .round-stars .frac span { color: rgba(43,37,33,.4); }
  #hud .rating-pill { font-family: 'Baloo 2'; font-weight: 700; font-size: 14px; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 24px 26px; gap: 12px; text-align: center;
  }

  .ding-svg { display: block; margin: 0 auto; }
  .hint { font-size: 13px; color: rgba(43,37,33,.55); max-width: 280px; line-height: 1.4; }
  .home-title { font-family: 'Baloo 2'; font-weight: 800; font-size: 26px; line-height: 1; margin-top: 2px; }

  /* Login */
  .auth-box { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .auth-input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 2px solid rgba(43,37,33,.15); font: 500 14px 'Hanken Grotesk'; background: var(--card); }
  .btn3d { border: none; border-radius: 17px; font-family: 'Baloo 2', cursive; font-weight: 700; color: #fff; cursor: pointer; box-shadow: 0 5px 0 var(--sh, rgba(0,0,0,.2)); transition: transform .08s, box-shadow .08s; width: 100%; padding: 14px; }
  .btn3d:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sh, rgba(0,0,0,.2)); }
  .btn-google { background: var(--card); border: 2px solid rgba(43,37,33,.15); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px; border-radius: 17px; font: 700 14px 'Hanken Grotesk'; cursor: pointer; }
  .auth-toggle { font: 600 12px 'Hanken Grotesk'; color: var(--c-comunicacion); background: none; border: none; cursor: pointer; text-decoration: underline; }
  .auth-error { font: 600 12px 'Hanken Grotesk'; color: var(--c-reservas); }

  #wheel-wrap { position: relative; width: 236px; height: 236px; margin: 8px auto 0; }
  #pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); z-index: 8; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid var(--ink); filter: drop-shadow(0 3px 2px rgba(43,37,33,.25)); }
  #wheel { width: 236px; height: 236px; border-radius: 50%; box-shadow: 0 14px 34px -10px rgba(43,37,33,.4), inset 0 0 0 7px #FBF6EC, inset 0 0 0 9px rgba(43,37,33,.12); transition: transform 3.2s cubic-bezier(.15,.9,.25,1); position: relative; }
  .wheel-icons { position: absolute; inset: 0; }
  .wheel-icon { position: absolute; top: 50%; left: 50%; margin: -13px; width: 26px; height: 26px; border-radius: 50%; background: #FBF6EC; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,.18); }
  .girar { position: absolute; top: 50%; left: 50%; width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--ink); background: radial-gradient(circle at 42% 34%, #fff, #F3EEE7); cursor: pointer; z-index: 6; box-shadow: 0 8px 16px -4px rgba(43,37,33,.4); animation: girarPulse 2.4s ease-in-out infinite; display: flex; align-items: center; justify-content: center; }
  .girar::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: repeating-conic-gradient(rgba(43,37,33,.32) 0 2.6deg, transparent 2.6deg 30deg); -webkit-mask: radial-gradient(closest-side, transparent 68%, #000 70%); mask: radial-gradient(closest-side, transparent 68%, #000 70%); }
  .girar span { position: relative; font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 17px; color: var(--c-reservas); letter-spacing: .02em; }
  .girar:active { transform: translate(-50%,-50%) scale(.95); animation: none; }
  .girar:disabled { opacity: .75; }

  .category-tag { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px; font-family: 'Baloo 2'; font-weight: 700; font-size: 12px; color: #12420F; }

  #question-text { font-family: 'Baloo 2'; font-weight: 600; font-size: 19px; line-height: 1.25; text-align: left; width: 100%; animation: fadeUp .35s ease; }
  #options-list { width: 100%; display: flex; flex-direction: column; gap: 9px; text-align: left; }
  .option { display: flex; align-items: center; gap: 11px; padding: 13px 14px; border-radius: 15px; border: 2px solid rgba(43,37,33,.12); background: var(--card); cursor: pointer; font: 600 13.5px 'Hanken Grotesk'; width: 100%; transition: .15s; }
  .option:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-2px); }
  .option .letter { width: 27px; height: 27px; flex: none; border-radius: 9px; background: var(--sand); display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2'; font-weight: 700; font-size: 13px; color: #B79B6E; }
  .option.correct { border-color: var(--c-aircover); background: #EAF8EA; }
  .option.incorrect { border-color: var(--c-reservas); background: #FCEEE7; }

  .result-tag { font-family: 'Baloo 2'; font-weight: 700; font-size: 13px; letter-spacing: 1px; }
  .result-title { font-family: 'Baloo 2'; font-weight: 800; font-size: 25px; margin-top: 2px; }
  .streak-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; background: var(--c-reservas); color: #fff; padding: 5px 13px; border-radius: 999px; font: 700 12px 'Hanken Grotesk'; }

  .explanation { margin-top: 14px; text-align: left; background: var(--card); border: 1.5px solid rgba(43,37,33,.1); border-radius: 16px; padding: 16px; width: 100%; }
  .explanation .label { font: 800 10px 'Hanken Grotesk'; letter-spacing: 1px; margin-bottom: 6px; color: rgba(43,37,33,.5); }
  .explanation p { font: 500 13.5px/1.5 'Hanken Grotesk'; }

  .primary-btn { margin-top: 18px; width: 100%; padding: 15px; border: none; border-radius: 17px; font-family: 'Baloo 2'; font-weight: 700; font-size: 17px; cursor: pointer; box-shadow: 0 5px 0 var(--sh, rgba(0,0,0,.2)); transition: transform .08s, box-shadow .08s; }
  .primary-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sh, rgba(0,0,0,.2)); }
  .primary-btn:disabled { opacity: .5; cursor: default; }
  .primary-btn.dark { background: var(--ink); color: #fff; --sh: #000; }
  .primary-btn.correct { background: var(--c-aircover); color: #12420F; --sh: #4A9A4A; }
  .primary-btn.warm { background: var(--c-reservas); color: #fff; --sh: #B4542E; }

  .stars-row { display: flex; gap: 4px; justify-content: center; margin: 6px 0; }
  .rating-delta { font-family: 'Baloo 2'; font-weight: 700; font-size: 13px; }
  .rating-delta.up { color: #3F9A40; }
  .rating-delta.down { color: var(--c-reservas); }

  /* Badge estilo reseña de Airbnb */
  .review-badge { width: 100%; margin-top: 6px; background: var(--card); border-radius: 20px; box-shadow: 0 8px 22px -10px rgba(43,37,33,.3); display: flex; align-items: stretch; padding: 15px 6px; animation: fadeUp .4s ease; }
  .review-badge .seg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 6px; }
  .review-badge .seg.fav { flex: 1.3; }
  .review-badge .divider { width: 1px; background: rgba(43,37,33,.12); margin: 6px 0; }
  .review-badge .seg-label { font: 700 10.5px 'Hanken Grotesk'; line-height: 1.2; text-align: center; }
  .review-badge .seg-number { font-family: 'Baloo 2'; font-weight: 800; font-size: 30px; line-height: .9; }
  .review-badge .seg-sub { font: 600 10px 'Hanken Grotesk'; color: rgba(43,37,33,.6); }
</style>
</head>

  function starSVG(filled, size, color) {
    size = size || 16;
    const fillColor = filled ? (color || '#2B2521') : 'rgba(43,37,33,.15)';
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="M12 2 L14.9 8.6 L22 9.3 L16.7 14.1 L18.2 21.2 L12 17.6 L5.8 21.2 L7.3 14.1 L2 9.3 L9.1 8.6 Z" fill="${fillColor}"/></svg>`;
  }
  document.getElementById('star-icon').innerHTML = starSVG(true, 15, '#F5C020');

  // ====== ESTADO ======
  let session = null;      // sesión de Supabase Auth
  let player = null;       // fila de la tabla players
  let roundIndex = 0;      // pregunta actual dentro de la ronda (0 a ROUND_LENGTH-1)
  let roundCorrect = 0;    // aciertos en la ronda actual = estrellas de esta partida
  let streak = 0;
  let currentCategory = null, currentQuestion = null;
  let questionsCache = {};

  const main = document.getElementById('main');
  const hud = document.getElementById('hud');
  const logoutBtn = document.getElementById('logout-btn');
  const roundStarsDisplay = document.getElementById('round-stars-display');
  const ratingDisplay = document.getElementById('rating-display');

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.reload();
  });

  function updateHud() {
    ratingDisplay.textContent = player.total_reviews > 0 ? Number(player.rating).toFixed(2) : '—';
    const filled = Array.from({length: ROUND_LENGTH}, (_, i) => starSVG(i < roundCorrect, 17, '#F5C020')).join('');
    roundStarsDisplay.innerHTML = `${filled}<span class="frac">${Math.min(roundCorrect, ROUND_LENGTH)}<span>/${ROUND_LENGTH}</span></span>`;
  }

  // ====== AUTH ======
  async function init() {
    renderPresentation();
  }

  function renderPresentation() {
    const chips = CATEGORIES.map(c => `
      <div style="display:flex; align-items:center; gap:8px; background:var(--card); border-radius:14px; padding:9px 10px; box-shadow:0 2px 6px -2px rgba(43,37,33,.15);">
        <span style="width:26px; height:26px; border-radius:8px; background:${c.hex}; flex:none; display:flex; align-items:center; justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${c.dark}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg>
        </span>
        <span style="font:600 11.5px 'Hanken Grotesk'; text-align:left; line-height:1.15;">${c.name}</span>
      </div>
    `).join('');

    main.innerHTML = `
      <div style="font:800 11px 'Baloo 2'; letter-spacing:.5px; color:#B79B6E; text-transform:uppercase;">El primer juego del mundo para anfitriones</div>
      ${keeperSVG('bienvenida', 76)}
      <div class="home-title" style="font-size:23px;">Aprendé y divertite<br>mientras crecés como anfitrión</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; margin-top:4px;">${chips}</div>
      <button class="primary-btn warm" id="start-btn" style="margin-top:16px;">Empezar a jugar</button>
    `;
    document.getElementById('start-btn').addEventListener('click', handleStartFromPresentation);
  }

  async function handleStartFromPresentation() {
    const { data: { session: s } } = await supabaseClient.auth.getSession();
    session = s;
    if (session) {
      await loadOrCreatePlayer();
      hud.style.display = 'flex';
      logoutBtn.style.display = 'inline';
      renderHome();
    } else {
      renderLogin();
    }
  }

  supabaseClient.auth.onAuthStateChange((event, s) => {
    if (event === 'SIGNED_IN' && !session) {
      session = s;
      loadOrCreatePlayer().then(() => {
        hud.style.display = 'flex';
        logoutBtn.style.display = 'inline';
        renderHome();
      });
    }
  });

  async function loadOrCreatePlayer() {
    const uid = session.user.id;
    let { data, error } = await supabaseClient.from('players').select('*').eq('id', uid).maybeSingle();
    if (!data) {
      const { data: created } = await supabaseClient.from('players').insert({
        id: uid, email: session.user.email, rating: 0, total_reviews: 0, perfect_streak: 0
      }).select().single();
      data = created;
    }
    player = data;
  }

  function renderLogin() {
    main.innerHTML = `
      ${keeperSVG('bienvenida', 84)}
      <div class="home-title" style="font-size:24px;">Iniciá sesión</div>
      <p class="hint">Guardá tu rating de anfitrión y seguí sumando partidas.</p>
      <div class="auth-box">
        <input class="auth-input" id="email-input" type="email" placeholder="Email" />
        <input class="auth-input" id="password-input" type="password" placeholder="Contraseña" />
        <div class="auth-error" id="auth-error"></div>
        <button class="btn3d" style="background:var(--ink);--sh:#000;" id="submit-btn">Ingresar</button>
        <button class="auth-toggle" id="toggle-mode">¿No tenés cuenta? Registrate</button>
        <div style="display:flex; align-items:center; gap:10px; margin:6px 0;">
          <div style="flex:1;height:1px;background:rgba(43,37,33,.15);"></div>
          <span style="font-size:11px;color:rgba(43,37,33,.4);">o</span>
          <div style="flex:1;height:1px;background:rgba(43,37,33,.15);"></div>
        </div>
        <button class="btn-google" id="google-btn">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.7 35.4 27 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.5l6.6 5.4C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Continuar con Google
        </button>
      </div>
    `;

    let mode = 'login';
    const toggleBtn = document.getElementById('toggle-mode');
    const submitBtn = document.getElementById('submit-btn');
    const errorDiv = document.getElementById('auth-error');

    toggleBtn.addEventListener('click', () => {
      mode = mode === 'login' ? 'signup' : 'login';
      submitBtn.textContent = mode === 'login' ? 'Ingresar' : 'Crear cuenta';
      toggleBtn.textContent = mode === 'login' ? '¿No tenés cuenta? Registrate' : '¿Ya tenés cuenta? Ingresá';
      errorDiv.textContent = '';
    });

    submitBtn.addEventListener('click', async () => {
      errorDiv.textContent = '';
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      if (!email || !password) { errorDiv.textContent = 'Completá email y contraseña.'; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = '...';
      let result;
      if (mode === 'login') {
        result = await supabaseClient.auth.signInWithPassword({ email, password });
      } else {
        result = await supabaseClient.auth.signUp({ email, password });
      }
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'login' ? 'Ingresar' : 'Crear cuenta';
      if (result.error) {
        errorDiv.textContent = result.error.message;
      } else if (mode === 'signup' && !result.data.session) {
        errorDiv.style.color = '#3F9A40';
        errorDiv.textContent = 'Cuenta creada. Revisá tu email para confirmar.';
      }
      // Si hay sesión, onAuthStateChange se encarga de renderizar el juego
    });

    document.getElementById('google-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
    });
  }

  async function fetchQuestions(categoryId) {
    if (questionsCache[categoryId]) return questionsCache[categoryId];
    try {
      const { data, error } = await supabaseClient.from('questions').select('*').eq('category_id', categoryId);
      if (error || !data || data.length === 0) throw new Error('sin datos');
      questionsCache[categoryId] = data.map(q => ({ question: q.question, options: q.options, correct_index: q.correct_index, explanation: q.explanation }));
    } catch (e) {
      questionsCache[categoryId] = FALLBACK_QUESTIONS[categoryId] || [];
    }
    return questionsCache[categoryId];
  }

  function renderHome() {
    updateHud();
    const gradient = CATEGORIES.map((c, i) => {
      const start = (i * 100) / CATEGORIES.length;
      const end = ((i + 1) * 100) / CATEGORIES.length;
      return `${c.hex} ${start}% ${end}%`;
    }).join(', ');

    const sliceAngle = 360 / CATEGORIES.length;
    const iconsHtml = CATEGORIES.map((c, i) => {
      const angle = sliceAngle * i + sliceAngle / 2;
      return `<span class="wheel-icon" style="transform:rotate(${angle}deg) translateY(-84px) rotate(-${angle}deg);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${c.dark}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg>
      </span>`;
    }).join('');

    main.innerHTML = `
      ${keeperSVG('bienvenida', 80)}
      <div class="home-title">¡A girar, anfitrión!</div>
      <p class="hint">Caé en una categoría y sumá estrellas.</p>
      <div id="wheel-wrap">
        <div id="pointer"></div>
        <div id="wheel" style="background: conic-gradient(${gradient});">
          <div class="wheel-icons">${iconsHtml}</div>
        </div>
        <button class="girar" id="spin-btn"><span>GIRAR</span></button>
      </div>
    `;
    document.getElementById('spin-btn').addEventListener('click', spinWheel);
  }

  function startNewRound() {
    roundIndex = 0;
    roundCorrect = 0;
    streak = 0;
    renderHome();
  }

  function spinWheel() {
    const btn = document.getElementById('spin-btn');
    const wheel = document.getElementById('wheel');
    const keeperEl = main.querySelector('.keeper-wrap');
    btn.disabled = true;
    if (keeperEl) keeperEl.classList.add('kp-lean');

    const randomIndex = Math.floor(Math.random() * CATEGORIES.length);
    const sliceAngle = 360 / CATEGORIES.length;
    const extraSpins = 5 * 360;
    const targetAngle = extraSpins + (360 - randomIndex * sliceAngle - sliceAngle / 2);
    wheel.style.transform = `rotate(${targetAngle}deg)`;

    setTimeout(async () => {
      currentCategory = CATEGORIES[randomIndex];
      const questions = await fetchQuestions(currentCategory.id);
      currentQuestion = questions[Math.floor(Math.random() * questions.length)];
      renderQuestion();
    }, 3300);
  }

  function renderQuestion() {
    if (!currentQuestion) {
      main.innerHTML = `<p>No hay preguntas cargadas para esta categoría todavía.</p>
        <button class="primary-btn dark" id="back-btn">Volver</button>`;
      document.getElementById('back-btn').addEventListener('click', renderHome);
      return;
    }
    const letters = ['A', 'B', 'C', 'D'];
    main.innerHTML = `
      <div style="width:100%;">
        <span class="category-tag" style="background:${currentCategory.hex}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${currentCategory.dark}" stroke-width="2.2" stroke-linejoin="round">${currentCategory.icon}</svg>
          ${currentCategory.name}
        </span>
        <div style="margin: 12px 0; display:flex; gap:11px; align-items:flex-start; text-align:left;">
          ${keeperSVG('bienvenida', 52, 'kp-think')}
          <div id="question-text" style="margin:0;">${currentQuestion.question}</div>
        </div>
        <div id="options-list" style="margin-top:16px;">
          ${currentQuestion.options.map((opt, i) => `
            <button class="option" data-index="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></button>
          `).join('')}
        </div>
      </div>
    `;
    document.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.index)));
    });
  }

  function handleAnswer(index) {
    document.querySelectorAll('.option').forEach(btn => btn.disabled = true);
    const isCorrect = index === currentQuestion.correct_index;

    document.querySelectorAll('.option').forEach((btn, i) => {
      if (i === currentQuestion.correct_index) btn.classList.add('correct');
      else if (i === index && !isCorrect) btn.classList.add('incorrect');
    });

    if (isCorrect) { roundCorrect += 1; streak += 1; } else { streak = 0; }
    roundIndex += 1;
    updateHud();

    setTimeout(() => {
      renderResult(isCorrect);
    }, 500);
  }

  function renderResult(isCorrect) {
    const isLastQuestion = roundIndex >= ROUND_LENGTH;

    main.innerHTML = `
      <span class="result-tag" style="color:${isCorrect ? '#3F9A40' : '#E8784A'}">${isCorrect ? '¡CORRECTO!' : 'CASI...'}</span>
      ${keeperSVG(isCorrect ? (streak > 1 ? 'racha' : 'correcto') : 'incorrecto', isCorrect ? 100 : 96)}
      ${isCorrect && streak > 1 ? `<span class="streak-badge">🔥 RACHA x${streak}</span>` : ''}
      <div class="explanation" style="border-color:${isCorrect ? 'var(--c-aircover)' : 'var(--c-reservas)'}">
        <div class="label" style="color:${isCorrect ? '#3F9A40' : '#E8784A'}">POR QUÉ</div>
        <p>${currentQuestion.explanation}</p>
      </div>
      <button class="primary-btn ${isCorrect ? 'correct' : 'dark'}" id="continue-btn">${isLastQuestion ? 'Ver resultado de la partida →' : 'Siguiente pregunta →'}</button>
    `;
    document.getElementById('continue-btn').addEventListener('click', () => {
      if (isLastQuestion) {
        finishRound();
      } else {
        renderHome();
      }
    });
  }

  function reviewBadge(showFavorito) {
    if (showFavorito) {
      return `
        <div class="review-badge">
          <div class="seg fav">
            <div style="display:flex;align-items:center;justify-content:center;height:34px;">
              <svg width="18" height="36" viewBox="0 0 40 80"><use href="#laurelL"/></svg>
              <svg width="18" height="36" viewBox="0 0 40 80" style="transform:scaleX(-1)"><use href="#laurelL"/></svg>
            </div>
            <div class="seg-label">Favorito entre<br>anfitriones</div>
          </div>
          <div class="divider"></div>
          <div class="seg">
            <div class="seg-number">${Number(player.rating).toFixed(2)}</div>
            <div class="stars-row" style="margin:0;">${Array.from({length:5}, () => starSVG(true, 11)).join('')}</div>
          </div>
          <div class="divider"></div>
          <div class="seg">
            <div class="seg-number">${player.total_reviews}</div>
            <div class="seg-sub">Partidas</div>
          </div>
        </div>`;
    }
    return `
      <div class="review-badge">
        <div class="seg">
          <div class="seg-number">${Number(player.rating).toFixed(2)}</div>
          <div class="stars-row" style="margin:0;">${Array.from({length:5}, (_,i) => starSVG(i < Math.round(player.rating), 12)).join('')}</div>
        </div>
        <div class="divider"></div>
        <div class="seg">
          <div class="seg-number">${player.total_reviews}</div>
          <div class="seg-sub">Partidas</div>
        </div>
      </div>`;
  }

  // ====== FIN DE PARTIDA: la ronda completa es la "reseña" (0 a ROUND_LENGTH estrellas) ======
  async function finishRound() {
    const roundStars = roundCorrect; // 0 a 5, una estrella por pregunta acertada
    const oldRating = Number(player.rating);
    const oldRounds = player.total_reviews;
    const newRounds = oldRounds + 1;
    const newRating = ((oldRating * oldRounds) + roundStars) / newRounds;
    const ratingDelta = oldRounds > 0 ? newRating - oldRating : 0;

    const wasPerfect = roundStars === ROUND_LENGTH;
    const prevStreak = player.perfect_streak || 0;
    const newStreak = wasPerfect ? prevStreak + 1 : 0;

    player.rating = newRating;
    player.total_reviews = newRounds;
    player.perfect_streak = newStreak;
    await supabaseClient.from('players').update({ rating: newRating, total_reviews: newRounds, perfect_streak: newStreak }).eq('id', player.id);

    const deltaClass = ratingDelta >= 0 ? 'up' : 'down';
    const deltaSign = ratingDelta >= 0 ? '+' : '';
    const showDelta = oldRounds > 0;
    const isFavorito = newStreak >= 1;

    const pose = wasPerfect ? 'nivel' : (roundStars === 0 ? 'incorrecto' : 'correcto');
    const animClass = wasPerfect ? 'kp-celebrate' : undefined;

    const sparkles = wasPerfect ? `
      <div class="kp-star" style="position:absolute;top:6px;left:-6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#F5DE50"><path d="M12 2l2.2 6.6L21 9l-5 4 1.8 7L12 16l-5.8 4L8 13 3 9l6.8-.4z"/></svg></div>
      <div class="kp-star" style="position:absolute;top:14px;right:-4px;animation-delay:.5s;"><svg width="14" height="14" viewBox="0 0 24 24" fill="#4CC3E8"><path d="M12 2l2.2 6.6L21 9l-5 4 1.8 7L12 16l-5.8 4L8 13 3 9l6.8-.4z"/></svg></div>
    ` : '';

    main.innerHTML = `
      <div class="result-tag" style="color:${wasPerfect ? '#3F9A40' : (roundStars === 0 ? 'var(--c-reservas)' : 'var(--ink)')}">${wasPerfect ? '¡PARTIDA PERFECTA!' : 'PARTIDA TERMINADA'}</div>
      <div style="position:relative; display:inline-block;">
        ${sparkles}
        ${keeperSVG(pose, 110, animClass)}
      </div>
      <div class="result-title">${wasPerfect ? '¡Cinco de cinco!' : `${roundCorrect} de ${ROUND_LENGTH} correctas`}</div>
      ${reviewBadge(isFavorito)}
      ${showDelta ? `<div class="rating-delta ${deltaClass}">${deltaSign}${ratingDelta.toFixed(2)} esta partida</div>` : ''}
      <p class="hint">${isFavorito ? 'Mantené el 5 estrellas y seguís siendo <b style="color:var(--ink)">favorito</b>. ¡No cortes la racha!' : 'Una partida perfecta (5 de 5) te devuelve el <b style="color:var(--ink)">favorito</b>.'}</p>
      <button class="primary-btn warm" id="again-btn">Jugar de nuevo</button>
    `;
    document.getElementById('again-btn').addEventListener('click', startNewRound);
  }

  init();
</script>
</body>
</html>
